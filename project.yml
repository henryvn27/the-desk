name: TheDesk
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  TheDeskMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/LearningHomeKit
      - path: Sources/LearningHome
      - path: Engine/learning_engine.py
        buildPhase: resources
      - path: Engine/runtime-lock.json
        buildPhase: resources
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(THE_DESK_MAC_BUNDLE_ID)
        PRODUCT_NAME: The Desk
        PRODUCT_MODULE_NAME: TheDeskMac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: The Desk
        INFOPLIST_KEY_TheDeskCloudContainerIdentifier: $(THE_DESK_CLOUD_CONTAINER)
        INFOPLIST_KEY_TheDeskKeychainService: $(THE_DESK_KEYCHAIN_SERVICE)
        INFOPLIST_KEY_NSMicrophoneUsageDescription: The Desk records only the study sessions you start.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: The Desk transcribes only recordings you explicitly import or create.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: The Desk adds only study blocks you explicitly approve and links them for safe updates.
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: The Desk creates reminders only after you approve them and reads only their linked completion state.
        CODE_SIGN_ENTITLEMENTS: Config/LearningHomeMac.entitlements
    scheme:
      testTargets:
        - TheDeskKitTests
  TheDeskMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources/LearningHomeKit
      - path: Sources/LearningHome
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(THE_DESK_MOBILE_BUNDLE_ID)
        PRODUCT_NAME: The Desk
        PRODUCT_MODULE_NAME: TheDeskMobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: The Desk
        INFOPLIST_KEY_TheDeskCloudContainerIdentifier: $(THE_DESK_CLOUD_CONTAINER)
        INFOPLIST_KEY_TheDeskKeychainService: $(THE_DESK_KEYCHAIN_SERVICE)
        INFOPLIST_KEY_NSCameraUsageDescription: The Desk scans notes and textbook pages when you choose Capture.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: The Desk records only the study sessions you start.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: The Desk transcribes only recordings you explicitly import or create on the Mac.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: The Desk displays approved study blocks; calendar writes happen on the paired Mac.
        INFOPLIST_KEY_UIBackgroundModes:
          - audio
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: The Desk displays linked reminder state from the paired Mac; it does not edit unrelated reminders.
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Config/LearningHomeMobile.entitlements
    scheme:
      testTargets: []
  TheDeskKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/LearningHomeKitTests
    dependencies:
      - target: TheDeskMac
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(THE_DESK_TEST_BUNDLE_ID)
